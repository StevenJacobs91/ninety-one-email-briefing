name: Deploy to Azure App Service

on:
  push:
    branches:
    - main
    - feat/pipeline
    - fix/ny1-email-brief
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: 'ny1-linux-internal'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies and build SPA (prod mode)
        run: |
          npm ci
          npm run build:prod
          
      - name: Prune to production dependencies
        run: npm prune --omit=dev

      - name: Create deployment package
        run: | 
          zip -r -q deploy.zip dist scripts agents "Themes and Modules" node_modules package.json package-lock.json
        
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        #if: ${{ github.ref == 'refs/heads/main' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: "production"
          package: deploy.zip
          # wwwroot is read-only (run-from-package), so copy dist to /tmp, inject env.js there, and serve from there
          startup-command: "chmod -R u+w /tmp/site 2>/dev/null; rm -rf /tmp/site && cp -r /home/site/wwwroot/dist /tmp/site && chmod -R u+w /tmp/site && node /home/site/wwwroot/scripts/write-env.cjs /tmp/site && pm2 serve /tmp/site --no-daemon --spa"
